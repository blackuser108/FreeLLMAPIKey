name: Cloud API
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  cloud:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix cloud ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix cloud run build
      - run: npm --prefix cloud run lint
      - run: npm --prefix cloud test
      - run: npm audit --prefix cloud --audit-level=moderate
